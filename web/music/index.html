<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Music Control Console</title>
<style>
  :root{
    --bg: #f8fafb;
    --panel: #ffffff;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-weak: rgba(37,99,235,0.08);
    --border: #e6eef6;
    --shadow: 0 6px 18px rgba(14,30,45,0.06);
    --radius: 12px;
    font-family: Inter, Roboto, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial;
  }
  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    color:#0f172a;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  /* Layout */
  .app {
    max-width:1200px;
    margin:20px auto;
    padding:18px;
    box-sizing:border-box;
  }

  /* Top panel */
  .top {
    background:var(--panel);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding:14px;
    display:flex;
    gap:12px;
    align-items:center;
    border:1px solid var(--border);
    flex-wrap:wrap;
  }
  .current-info {
    flex:1 1 320px;
  }
  .controls {
    display:flex;
    gap:8px;
    align-items:center;
  }
  .btn {
    background:transparent;
    border:1px solid var(--border);
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
  }
  .btn.primary {
    background:var(--accent);
    color:white;
    border-color:transparent;
    box-shadow: none;
  }
  .small {
    font-size:13px;
    color:var(--muted);
  }

  input[type="range"]{
    width:180px;
    -webkit-appearance:none;
    height:6px;
    background:var(--border);
    border-radius:6px;
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px;height:16px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 1px 4px rgba(0,0,0,0.15);
    cursor:pointer;
  }

  /* main area */
  .main {
    display:flex;
    gap:16px;
    margin-top:16px;
  }
  .panel {
    background:var(--panel);
    border-radius:var(--radius);
    padding:14px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
  }
  .left {
    width:260px;
    min-width:200px;
    flex:0 0 260px;
    display:flex;flex-direction:column;gap:12px;
  }
  .right {
    flex:1;
    display:flex;flex-direction:column;gap:12px;
  }
  .playlists-list {
    display:flex;flex-direction:column;gap:8px;
    max-height:56vh; overflow:auto; padding-right:6px;
  }
  .playlist-item {
    padding:10px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:space-between;
    cursor:pointer;
    border:1px solid transparent;
  }
  .playlist-item:hover { background:var(--accent-weak); }
  .playlist-item.active { border-color:var(--accent-weak); box-shadow:0 2px 8px rgba(37,99,235,0.06); }

  .tracks-list { display:flex;flex-direction:column;gap:10px; max-height:60vh; overflow:auto; padding-right:6px; }
  .track {
    display:flex;gap:12px;align-items:center;justify-content:space-between;
    padding:10px;border-radius:10px;border:1px solid transparent;
  }
  .track:hover{ background:#fbfdff; }

  .track .left { display:flex;gap:12px;align-items:center; flex:1; }
  .small-muted{ font-size:13px;color:var(--muted); }

  .file-uploader { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .controls-row { display:flex; gap:8px; align-items:center; }

  /* Responsive: mobile stacks */
  @media (max-width:900px){
    .app { padding:10px; }
    .main { flex-direction:column; }
    .left { width:100%; flex:0 0 auto; order:2; }
    .right { order:3; }
    .top { order:1; }
  }

  /* tiny touches */
  .muted { color:var(--muted); font-size:13px; }
  .heading { font-weight:700; font-size:15px; }
  .sub { font-size:13px; color:var(--muted); }
  .flex { display:flex; align-items:center; gap:8px; }
  .spacer { flex:1; }
  .danger { background:#fff1f2; border:1px solid #fecaca; color:#b91c1c; }
  .chip { padding:6px 8px; border-radius:999px; background:#f1f5f9; font-weight:600; font-size:13px; }
  label { font-size:13px; color:var(--muted); display:block; margin-bottom:6px; }
</style>
</head>
<body>
  <div class="app">
    <div class="top panel">
      <div class="current-info">
        <div class="heading" id="current-title">— Нет текущего трека —</div>
        <div class="small-muted" id="current-sub">Статус: —</div>
      </div>

      <div class="controls">
        <button class="btn" id="btn-prev" title="Предыдущий (на сервере)">&lt;&lt;</button>
        <button class="btn" id="btn-play" title="Пауза / Воспроизвести">Play</button>
        <button class="btn" id="btn-next" title="Следующий">≫</button>
      </div>

      <div style="width:12px"></div>

      <div style="display:flex;flex-direction:column;align-items:flex-end;">
        <div class="muted">Глобальная громкость</div>
        <div class="flex">
          <input id="global-volume" type="range" min="0" max="1" step="0.01" value="1" />
          <div class="chip" id="global-volume-label">100%</div>
        </div>
      </div>
    </div>

    <div class="main">
      <div class="left panel">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div class="heading">Плейлисты</div>
            <div class="sub">Список плейлистов на сервере</div>
          </div>
          <div class="controls-row">
            <button class="btn" id="btn-refresh">Обновить</button>
          </div>
        </div>

        <div style="display:flex;gap:8px;align-items:center;">
          <input id="new-playlist-name" placeholder="Новый плейлист" style="flex:1;padding:8px;border-radius:10px;border:1px solid var(--border)" />
          <button class="btn primary" id="btn-add-playlist">Добавить</button>
        </div>

        <div class="playlists-list" id="playlists-list">
          <!-- playlists injected here -->
        </div>

        <div style="margin-top:auto">
          <div class="small-muted">Подсказка: выберите плейлист чтобы увидеть треки</div>
        </div>
      </div>

      <div class="right panel">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div>
            <div class="heading" id="playlist-title">Плейлист — (ничего не выбрано)</div>
            <div class="sub" id="playlist-sub"></div>
          </div>
          <div style="display:flex;gap:8px;align-items:center;">
            <div style="text-align:right;">
              <div class="muted">Громкость плейлиста</div>
              <div class="flex">
                <input id="playlist-volume" type="range" min="0" max="1" step="0.01" value="1" />
                <div class="chip" id="playlist-volume-label">100%</div>
              </div>
            </div>
            <div>
              <button class="btn danger" id="btn-delete-playlist">Удалить</button>
            </div>
          </div>
        </div>

        <div style="display:flex;gap:8px;align-items:center;">
          <div class="file-uploader">
            <input id="track-name" placeholder="Имя трека" style="padding:8px;border-radius:10px;border:1px solid var(--border)" />
            <input id="track-file" type="file" accept="audio/*" />
            <button class="btn primary" id="btn-add-track">Загрузить</button>
          </div>
        </div>

        <div style="margin-top:8px">
          <div class="heading">Треки</div>
          <div class="sub">Список треков выбранного плейлиста</div>
        </div>

        <div class="tracks-list" id="tracks-list">
          <!-- tracks injected here -->
        </div>
      </div>
    </div>
  </div>

<script>
/*
  Single-file JS frontend for the audio control API.

  Поддерживает:
  - показать текущий трек
  - play/pause/next (через POST /audio_player/current/action/{action})
  - общий слайдер громкости -> POST /audio_player/volume/{value}
  - список плейлистов -> GET /audio_player/playlists
  - выбрать плейлист -> GET /audio_player/playlist/{id}
  - создать плейлист -> POST /audio_player/playlist { name }
  - удалить плейлист -> DELETE /audio_player/playlist/{id}
  - загрузить трек в плейлист -> POST multipart to /audio_player/playlist/{id}/track (fields name,file)
  - удалить трек -> DELETE /audio_player/playlist/{pid}/track/{tid}
  - выставить громкость плейлиста -> POST /audio_player/playlist/{pid}/volume/{value}
  - выставить громкость трека -> POST /audio_player/playlist/{pid}/track/{tid}/volume/{value}
  - воспроизведение трека в браузере -> <audio src="/audio_player/playlist/{pid}/track/{tid}">
*/

const API_BASE = '/audio_player';

let state = {
  playlists: [],
  selectedPlaylist: null,
  current: null,
  globalVolume: 1,
  playlistVolumes: {}, // cache
  trackVolumes: {}, // cache { playlist: { track: v } }
};

const el = id => document.getElementById(id);

async function apiFetch(path, opts = {}) {
  // helper: returns parsed JSON or throws
  const url = API_BASE + path;
  const res = await fetch(url, opts);
  if (!res.ok) {
    const txt = await res.text().catch(()=>'');
    throw new Error(`HTTP ${res.status} ${txt}`);
  }
  // try parse json, else return text
  const ct = res.headers.get('content-type') || '';
  if (ct.includes('application/json')) return res.json();
  return res;
}

/* Current track */
async function loadCurrent() {
  try {
    const data = await apiFetch('/current');
    state.current = data.track || null;
    updateCurrentUI();
  } catch(e) {
    console.warn('loadCurrent failed', e);
    el('current-title').textContent = 'Ошибка загрузки текущего трека';
    el('current-sub').textContent = e.message;
  }
}

function updateCurrentUI(){
  if(!state.current) {
    el('current-title').textContent = '— Нет текущего трека —';
    el('current-sub').textContent = 'Статус: —';
    el('btn-play').textContent = 'Play';
    return;
  }
  // current may be simple string or object
  let title = typeof state.current === 'string' ? state.current : (state.current.name || state.current.id || JSON.stringify(state.current));
  el('current-title').textContent = title;
  el('current-sub').textContent = 'Статус: проигрывается на сервере';
  el('btn-play').textContent = 'Pause';
}

/* Play/pause/next */
async function doAction(action) {
  try {
    await apiFetch(`/current/action/${encodeURIComponent(action)}`, { method: 'POST' });
    await loadCurrent();
  } catch(e) {
    alert('Ошибка действия: ' + e.message);
  }
}

/* Global volume */
async function setGlobalVolume(v) {
  try {
    await apiFetch(`/volume/${encodeURIComponent(v)}`, { method: 'POST' });
    state.globalVolume = Number(v);
    el('global-volume-label').textContent = Math.round(state.globalVolume * 100) + '%';
    // also adjust all playing audio elements' volume (local multiplication)
    updateAllAudioVolumes();
  } catch(e) {
    console.warn('setGlobalVolume failed', e);
  }
}

/* Playlists */
async function loadPlaylists() {
  try {
    const data = await apiFetch('/playlists');
    state.playlists = data.playlists || [];
    renderPlaylists();
  } catch(e) {
    console.warn('loadPlaylists failed', e);
    el('playlists-list').innerHTML = `<div class="muted">Ошибка загрузки: ${e.message}</div>`;
  }
}

function renderPlaylists(){
  const container = el('playlists-list');
  container.innerHTML = '';
  if(!state.playlists.length) {
    container.innerHTML = `<div class="muted">Плейлистов нет</div>`;
    return;
  }
  state.playlists.forEach(pl => {
    const id = pl.id || pl.name || JSON.stringify(pl);
    const name = pl.name || id;
    const item = document.createElement('div');
    item.className = 'playlist-item' + (state.selectedPlaylist && state.selectedPlaylist.id === id ? ' active' : '');
    item.innerHTML = `<div style="display:flex;gap:10px;align-items:center;">
                        <div style="width:10px;height:10px;border-radius:50%;background:var(--accent)"></div>
                        <div style="min-width:0">
                          <div style="font-weight:700;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;max-width:160px">${escapeHtml(name)}</div>
                          <div class="small-muted">${escapeHtml(id)}</div>
                        </div>
                      </div>
                      <div style="display:flex;gap:8px;align-items:center;">
                        <button class="btn" data-id="${escapeHtml(id)}" title="Выбрать">Open</button>
                      </div>`;
    container.appendChild(item);
    item.querySelector('button').onclick = () => selectPlaylist(id);
  });
}

/* Create/Delete playlist */
async function createPlaylist(){
  const name = el('new-playlist-name').value.trim();
  if(!name) { alert('Введите имя плейлиста'); return; }
  try {
    await apiFetch('/playlist', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    el('new-playlist-name').value = '';
    await loadPlaylists();
  } catch(e) {
    alert('Не удалось создать плейлист: ' + e.message);
  }
}

async function deletePlaylist(){
  if(!state.selectedPlaylist) { alert('Плейлист не выбран'); return; }
  if(!confirm('Удалить плейлист "' + (state.selectedPlaylist.name||state.selectedPlaylist.id) + '"?')) return;
  try {
    await apiFetch(`/playlist/${encodeURIComponent(state.selectedPlaylist.id)}`, { method: 'DELETE' });
    state.selectedPlaylist = null;
    el('playlist-title').textContent = 'Плейлист — (ничего не выбрано)';
    el('tracks-list').innerHTML = '';
    await loadPlaylists();
  } catch(e) {
    alert('Ошибка удаления: ' + e.message);
  }
}

/* Select playlist and load details */
async function selectPlaylist(id){
  try {
    const data = await apiFetch(`/playlist/${encodeURIComponent(id)}`);
    const pl = data.playlist;
    // ensure id assigned
    pl.id = pl.id || id;
    state.selectedPlaylist = pl;
    el('playlist-title').textContent = pl.name || pl.id;
    el('playlist-sub').textContent = `Треков: ${ (pl.tracks || []).length }`;
    // set playlist volume cache if available
    if(pl.volume !== undefined) {
      state.playlistVolumes[pl.id] = pl.volume;
    } else {
      state.playlistVolumes[pl.id] = state.playlistVolumes[pl.id] ?? 1;
    }
    el('playlist-volume').value = state.playlistVolumes[pl.id];
    el('playlist-volume-label').textContent = Math.round(el('playlist-volume').value*100) + '%';
    renderTracks(pl);
  } catch(e) {
    alert('Не удалось получить плейлист: ' + e.message);
  }
}

function renderTracks(playlist){
  const list = el('tracks-list');
  list.innerHTML = '';
  const tracks = playlist.tracks || [];
  if(!tracks.length) {
    list.innerHTML = '<div class="muted">Треков нет</div>';
    return;
  }
  tracks.forEach(tr => {
    const tid = tr.id || tr.name || Math.random().toString(36).slice(2,8);
    const tname = tr.name || tid;
    if(!state.trackVolumes[playlist.id]) state.trackVolumes[playlist.id] = {};
    if(tr.volume !== undefined) state.trackVolumes[playlist.id][tid] = tr.volume;
    const trackEl = document.createElement('div');
    trackEl.className = 'track';
    trackEl.innerHTML = `
      <div class="left">
        <div style="display:flex;flex-direction:column;">
          <div style="font-weight:700">${escapeHtml(tname)}</div>
          <div class="small-muted">${escapeHtml(tid)}</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <audio id="audio-${escapeHtml(tid)}" preload="none" controls style="height:30px"></audio>
        <div style="display:flex;flex-direction:column;align-items:center;">
          <input type="range" min="0" max="1" step="0.01" value="${state.trackVolumes[playlist.id][tid] ?? 1}" data-playlist="${escapeHtml(playlist.id)}" data-track="${escapeHtml(tid)}" class="track-volume" />
          <div class="small-muted track-volume-label">${Math.round((state.trackVolumes[playlist.id][tid] ?? 1)*100)}%</div>
        </div>
        <button class="btn" data-pid="${escapeHtml(playlist.id)}" data-tid="${escapeHtml(tid)}">Удалить</button>
      </div>
    `;
    list.appendChild(trackEl);

    // set audio src to stream endpoint
    const audio = trackEl.querySelector('audio');
    audio.src = `${API_BASE}/playlist/${encodeURIComponent(playlist.id)}/track/${encodeURIComponent(tid)}`;
    // compute starting volume (global * playlist * track)
    setTimeout(()=>{ updateAudioVolume(audio, playlist.id, tid); }, 50);

    // wire delete
    trackEl.querySelector('button').onclick = async (ev) => {
      if(!confirm(`Удалить трек "${tname}" ?`)) return;
      try {
        await apiFetch(`/playlist/${encodeURIComponent(playlist.id)}/track/${encodeURIComponent(tid)}`, { method: 'DELETE' });
        // refresh playlist
        selectPlaylist(playlist.id);
      } catch(e) {
        alert('Ошибка удаления: ' + e.message);
      }
    };
  });

  // hook track volume inputs
  list.querySelectorAll('.track-volume').forEach(inp=>{
    inp.addEventListener('input', (e)=>{
      const v = Number(e.target.value);
      const pid = e.target.dataset.playlist;
      const tid = e.target.dataset.track;
      state.trackVolumes[pid] = state.trackVolumes[pid] || {};
      state.trackVolumes[pid][tid] = v;
      const label = e.target.parentElement.querySelector('.track-volume-label');
      if(label) label.textContent = Math.round(v*100) + '%';
      // local adjust
      const audio = el('audio-' + tid);
      if(audio) updateAudioVolume(audio, pid, tid);
    });
    inp.addEventListener('change', async (e)=>{
      // on change send to server
      const v = Number(e.target.value);
      const pid = e.target.dataset.playlist;
      const tid = e.target.dataset.track;
      try {
        await apiFetch(`/playlist/${encodeURIComponent(pid)}/track/${encodeURIComponent(tid)}/volume/${encodeURIComponent(v)}`, { method: 'POST' });
      } catch(err) {
        console.warn('set track volume failed', err);
      }
    });
  });
}

/* Upload track */
async function uploadTrack(){
  const pid = state.selectedPlaylist && state.selectedPlaylist.id;
  if(!pid){ alert('Выберите плейлист'); return; }
  const name = el('track-name').value.trim();
  const fileInput = el('track-file');
  if(!fileInput.files.length){ alert('Выберите аудиофайл'); return; }
  const file = fileInput.files[0];
  const fd = new FormData();
  fd.append('name', name || file.name);
  fd.append('file', file);
  try {
    await fetch(`${API_BASE}/playlist/${encodeURIComponent(pid)}/track`, {
      method: 'POST',
      body: fd
    }).then(res=>{
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res.json().catch(()=>null);
    });
    el('track-name').value = '';
    el('track-file').value = '';
    await selectPlaylist(pid);
  } catch(e) {
    alert('Ошибка загрузки: ' + e.message);
  }
}

/* Playlist volume control */
async function setPlaylistVolume(pid, v) {
  try {
    await apiFetch(`/playlist/${encodeURIComponent(pid)}/volume/${encodeURIComponent(v)}`, { method: 'POST' });
    state.playlistVolumes[pid] = Number(v);
    el('playlist-volume-label').textContent = Math.round(Number(v)*100) + '%';
    updateAllAudioVolumes();
  } catch(e) {
    console.warn('setPlaylistVolume failed', e);
  }
}

/* Helpers to compute and apply local audio volume */
function updateAudioVolume(audioEl, pid, tid){
  const g = Number(state.globalVolume ?? 1);
  const p = Number((state.playlistVolumes[pid] ?? 1));
  const t = Number((state.trackVolumes[pid] && state.trackVolumes[pid][tid]) ?? 1);
  let vol = g * p * t;
  // clamp
  if(isNaN(vol) || vol < 0) vol = 0;
  if(vol > 1) vol = 1;
  audioEl.volume = vol;
}

function updateAllAudioVolumes(){
  document.querySelectorAll('audio[id^="audio-"]').forEach(a=>{
    const id = a.id.replace(/^audio-/, '');
    // try to find playlist for this audio by looking at parent dataset
    const trackInput = document.querySelector(`.track-volume[data-track="${CSS.escape(id)}"]`);
    if(trackInput){
      const pid = trackInput.dataset.playlist;
      updateAudioVolume(a, pid, id);
    }
  });
}

/* Utilities */
function escapeHtml(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

/* Event listeners */
el('btn-refresh').onclick = () => loadPlaylists();
el('btn-add-playlist').onclick = () => createPlaylist();
el('btn-delete-playlist').onclick = () => deletePlaylist();
el('btn-add-track').onclick = () => uploadTrack();
el('btn-play').onclick = () => {
  // toggle: if button currently shows Pause -> send pause
  const txt = el('btn-play').textContent.toLowerCase();
  if(txt.includes('pause')) doAction('pause');
  else doAction('resume');
};
el('btn-next').onclick = () => doAction('next');
el('btn-prev').onclick = () => doAction('prev'); // if server supports prev

el('global-volume').addEventListener('input', (e)=>{
  el('global-volume-label').textContent = Math.round(Number(e.target.value)*100) + '%';
  state.globalVolume = Number(e.target.value);
  updateAllAudioVolumes();
});
el('global-volume').addEventListener('change', (e)=>{
  setGlobalVolume(Number(e.target.value));
});

el('playlist-volume').addEventListener('input', (e)=>{
  el('playlist-volume-label').textContent = Math.round(Number(e.target.value)*100) + '%';
});
el('playlist-volume').addEventListener('change', (e)=>{
  if(!state.selectedPlaylist) return;
  setPlaylistVolume(state.selectedPlaylist.id, Number(e.target.value));
});

/* Boot */
async function boot(){
  try {
    await loadCurrent();
    await loadPlaylists();
    // poll current every 10s to keep UI in sync
    setInterval(()=>loadCurrent(), 10000);
  } catch(e){
    console.warn('boot err', e);
  }
}
boot();

</script>
</body>
</html>
