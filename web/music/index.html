<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1"/>
        <title>Консоль управления музыкой</title>
        <style>
            * {
                box-sizing: border-box
            }

            :root {
                --bg: #ffffff;
                --muted: #f3f4f6;
                --panel: #ffffff;
                --text: #0f172a;
                --muted-text: #64748b;
                --accent: #111827;
                --divider: #e6e7e9;
                --shadow: 0 6px 18px rgba(14, 20, 30, 0.06);
            }

            body {
                width: 80%;

                font-family: Inter, ui-sans-serif,system-ui, Segoe UI,Roboto, Helvetica, Arial;
                margin: auto;
                color: var(--text);
                background: linear-gradient(180deg,var(--bg), var(--muted));
            }

            .app {
                display: grid;
                grid-template-columns: 260px 1fr;
                grid-template-rows: auto 1fr;
                gap: 18px;
                height: 100vh;
                padding: 18px;
            }

            header.top {
                grid-column: 1/3;
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 14px;
                background: var(--panel);
                border-radius: 12px;
                box-shadow: var(--shadow);
                border: 1px solid var(--divider)
            }

            .left {
                background: var(--panel);
                border-radius: 12px;
                padding: 12px;
                box-shadow: var(--shadow);
                border: 1px solid var(--divider);
            }

            .right {
                height: 100%;
                background: var(--panel);
                border-radius: 12px;
                padding: 12px;
                box-shadow: var(--shadow);
                border: 1px solid var(--divider);
                display: flex;
                flex-direction: column;
                min-height: 0;
            }

            .current-track {
                flex: 1
            }
            .current-track h3 {
                margin: 0 0 6px 0;
                font-size: 18px
            }

            .controls{display:flex; align-items:center; gap:8px}
            .button{background:#fff;border:1px solid var(--divider);padding:8px 10px;border-radius:8px; cursor:pointer; min-width:40px}
            .big-button{padding:10px 14px}
            input[type=range]{width:160px}

            .playlist-list{display:flex;flex-direction:column;gap:8px}
            .playlist-item {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 8px;
                border-radius: 8px;
                border: 1px solid var(--divider);
                background: linear-gradient(180deg,#fff,#fbfbfb)
            }
            .playlist-item .title {
                font-weight: bold;
            }

            .playlist-item.selected{outline:2px solid rgba(17,24,39,0.06)}
            .actions{display:flex;gap:8px}

            .TrackList {
                display: flex;
                flex-direction: column;
                gap: 8px;
                margin-top: 8px;
                overflow-y: auto;

                flex: 1;
                min-height: 0;
            }
            .track{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;border:1px solid var(--divider);background:#fff}
            .track .title{flex:1}
            .track .track-actions{display:flex;gap:8px;align-items:center}

            .modal-backdrop{position:fixed;inset:0;background:rgba(10,10,12,0.45);display:none;align-items:center;justify-content:center}
            .modal{background:#fff;padding:18px;border-radius:12px;min-width:320px}

            @media (max-width: 1200px) {
                body {
                    width: 90%;
                }
            }
            
            @media (max-width: 1000px) {
                body {
                    width: 100%;
                }
                .app {
                    grid-template-columns: 1fr;
                    grid-template-rows: auto;
                    padding: 4px
                }
                header.top {
                    grid-column: 1/2
                }
                .controls {
                    display: block;
                }
                .left, .right {
                    height: 100%;
                    background: var(--panel);
                    border-radius: 12px;
                    padding: 12px;
                    box-shadow: var(--shadow);
                    border: 1px solid var(--divider);

                    display: flex;
                    flex-direction: column;
                    min-height: 0;
                }
                .left, .right {
                    height: 100%;
                    background: var(--panel);
                    border-radius: 12px;
                    padding: 12px;
                    box-shadow: var(--shadow);
                    border: 1px solid var(--divider);

                    display: flex;
                    flex-direction: column;
                    min-height: 0;
                }
                .app > .left{order:1}
                .app > .right {
                    height: 100%;
                    background: var(--panel);
                    border-radius: 12px;
                    padding: 12px;
                    box-shadow: var(--shadow);
                    border: 1px solid var(--divider);

                    display: flex;
                    flex-direction: column;
                    min-height: 0;
                }
            }

            .muted {
                color:var(--muted-text);
                font-size:13px
            }
            .small {
                font-size:13px
            }
            .icon {
                display:inline-grid;
                place-items:center
            }

            .non-display {
                display: none;
            }
        </style>

        <script>
            function $(id) {
                return document.getElementById(id)
            }

            function showModal(html) {
                $('modalContent').innerHTML = html;
                $('modal').style.display = 'flex';
            }

            function hideModal() {
                $('modal').style.display = 'none';
                $('modalContent').innerHTML = '';
            }

            function escapeHtml(s) {
                if (s == null) return '';
                return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;' }[c]));
            }

            function api(path, opts = {}) {
                return fetch(path, opts).then(async res => {
                    if (!res.ok) {
                        let text = await res.text();
                        throw new Error(res.status + ' ' + res.statusText + '\n' + text);
                    }
                    let ct = res.headers.get('content-type') || '';
                    if (ct.includes('application/json')) return res.json();
                    return res;
                });
            }

            class ServerAudioPlayer {
                constructor() {
                    this.volume = 50;
                    this.currentTrack = null;
                }

                bindUI() {
                    $('globalVolume').oninput = (e) => this.setVolume(e.target.value);
                    $('btnPlay').onclick = () => this.sendAction('play');
                    $('btnPause').onclick = () => this.sendAction('pause');
                    $('btnNext').onclick = () => this.sendAction('next');

                    this.update();
                    setInterval(() => this.update(), 5000);
                }

                async update() {
                    try {
                        await Promise.all(
                            [
                                this.getCurrentPlayingTrack(),
                                this.getVolume()
                            ]
                        );
                    }
                    catch(err) {
                        console.error(err);
                    }
                }

                async getVolume() {
                    try {
                        let data = await api('/audio_player/volume');
                        this.volume = Math.round((data.volume || 0) * 100);
                        $('globalVolume').value = this.volume;
                    }
                    catch(err) {
                        console.warn('Не удалось получить глобальную громкость',err);
                    }
                }

                async setVolume(volume) {
                    let vol = Number(volume) / 100;
                    try {
                        await api('/audio_player/volume/' + encodeURIComponent(vol), { method: 'POST' });
                        this.volume = vol;
                    }
                    catch(err) {
                        console.warn(err);
                    }
                }

                async sendAction(action) {
                    try {
                        await api('/audio_player/current/action/' + encodeURIComponent(action), { method: 'POST' });
                    }
                    catch(err) {
                        alert('Ошибка действия: '+err.message);
                    }
                }

                async getCurrentPlayingTrack() {
                    try {
                        let data = await api('/audio_player/current');
                        this.currentTrack = data.track || null;
                        $('currentTitle').textContent = this.currentTrack ? ('Текущий трек — ' + this.currentTrack) : 'Текущий трек — —';
                    }
                    catch(err) {
                        console.error('Ошибка получения текущего трека', err);
                    }
                }
            }


            class Playlists {
                constructor() {
                    this.playlists = [];

                    this.selectedPlaylist = null;
                }

                bindUI() {
                    $('btnRefresh').onclick = () => this.getPlaylists();
                    $('btnAddPlaylist').onclick = () => this.showCreatePlaylistModal();

                    this.update();
                    setInterval(() => this.update(), 5000);
                }

                async update() {
                    this.getPlaylists();
                    this.renderPlaylists();

                    if (this.selectedPlaylist) {
                        this.selectedPlaylist.update();
                    }
                }

                async getPlaylists() {
                    try {
                        let data = await api('/audio_player/playlists');
                        this.playlists = data.playlists || [];
                        await this.renderPlaylists();
                    }
                    catch(err) {
                        console.error(err);
                    }
                }

                async renderPlaylists() {
                    let wrap = $('playlists');

                    wrap.innerHTML = '';

                    this.playlists.forEach(playlist => {
                        let element = document.createElement('div');
                        element.className = 'playlist-item';

                        if (this.selectedPlaylist && playlist.id === this.selectedPlaylist.id) element.classList.add('selected');

                        element.innerHTML = `
                            <div style="display:flex;flex-direction:column;gap:2px">
                            <div class="title">${escapeHtml(playlist.name)}</div>
                            <div class="muted small">ID: ${escapeHtml(playlist.id)}</div>
                            <div class="muted small">Треков: ${escapeHtml(playlist.tracks_count)}</div>
                            </div>`;
                        element.onclick = () => this.selectPlaylist(playlist.id);
                        wrap.appendChild(element);
                    });
                }

                async selectPlaylist(id) {
                    try {
                        let data = await api('/audio_player/playlist/' + encodeURIComponent(id));
                        this.selectedPlaylist = new Playlist(data.playlist);
                        this.selectedPlaylist.bindUI();
                        this.selectedPlaylist.render();
                        this.renderPlaylists();
                    }
                    catch(err) {
                        console.error(err);
                    }
                }

                async createPlaylist(name) {
                    try {
                        let res = await api('/audio_player/playlist', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({name}) });
                        await this.getPlaylists();
                        await this.renderPlaylists();
                        hideModal();
                    }
                    catch(err) {
                        alert('Ошибка создания плейлиста: ' + err.message);
                    }
                }

                async deletePlaylist(id) {
                    if (!confirm('Удалить плейлист?')) return;

                    try {
                        let data = await api('/audio_player/playlist/' + encodeURIComponent(id), { method: 'DELETE' });
                        await this.getPlaylists();
                    }
                    catch(err) {
                        alert('Ошибка удаления плейлиста: ' + err.message);
                    }
                }

                showCreatePlaylistModal() {
                    showModal(
                        `<h3>Новый плейлист</h3>
                        <div style="margin-top:8px">
                        <input id="newPlaylistName" placeholder="Название" style="width:100%;padding:8px;border:1px solid var(--divider);border-radius:8px"/>
                        </div>
                        <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end">
                        <button class="button" onclick="hideModal()">Отмена</button>
                        <button class="button" onclick="playlists.confirmCreatePlaylist()">Создать</button>
                        </div>`
                    );
                    setTimeout(() => $('newPlaylistName').focus(), 50);
                }

                confirmCreatePlaylist() {
                    let name = $('newPlaylistName').value.trim();
                    if (!name) {
                        alert('Введите название');
                        return;
                    }
                    this.createPlaylist(name);
                }
            }


            class Playlist {
                constructor(data) {
                    this.id = data.id;
                    this.name = data.name;
                    this.directory = data.directory;
                    this.tracks = data.tracks;
                    this.period = data.period;
                    this.volume = data.volume;
                }

                bindUI() {
                    $('playlistVolume').oninput = (e) => {
                        this.setPlaylistVolume(e.target.value);
                    };

                    $('btnDelete').onclick = async () => {
                        await playlists.deletePlaylist(this.id);
                        await playlists.getPlaylists();
                        await playlists.renderPlaylists();
                    };

                    $('btnAddTrack').onclick = () => this.showAddTrackModal();

                    $('modal').addEventListener('click', (e) => { if(e.target === $('modal')) hideModal(); });
                }

                async update() {
                    try {
                        this.render();
                    }
                    catch(err) {
                        console.error(err);
                    }
                }

                showAddTrackModal() {
                    if (!playlists.selectedPlaylist) {
                        alert('Выберите плейлист');
                        return;
                    }
                    showModal(`<h3>Добавить трек</h3>
                        <div style="margin-top:8px"><input id="trackName" placeholder="(имя файла сохранятся как имя трека)" style="width:100%;padding:8px;border:1px solid var(--divider);border-radius:8px"/></div>
                        <div style="margin-top:8px"><input id="trackFile" type="file" accept="audio/*" style="width:100%"/></div>
                        <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end">
                        <button class="button" onclick="hideModal()">Отмена</button>
                        <button class="button" onclick="playlists.selectedPlaylist.confirmAddTrack()">Загрузить</button>
                        </div>`);
                }

                async setPlaylistVolume(volume) {
                    try {
                        let vol = Number(volume) / 100;
                        await api('/audio_player/playlist/' + encodeURIComponent(this.id) + '/volume/' + encodeURIComponent(vol), { method: 'POST' });
                        this.volume = vol;
                    }
                    catch(err) {
                        console.warn(err);
                    }
                }

                async render() {
                    $('playlistName').textContent = `${this.name || '—'} (ID: ${this.id || '-'})`;
                    $('playlistInfo').textContent = `Папка: ${this.directory || '-'} · Треков: ${(this.tracks || []).length} · Период: ${this.period || '-'} с`;
                    $('playlistVolume').value = Math.round((this.volume || 0.5) * 100);

                    let trackList = $('TrackList');
                    trackList.innerHTML = '';
                    (this.tracks || []).forEach(track => {
                        let trackElement = document.createElement('div');
                        trackElement.className = 'track';


                        let title = document.createElement('div');
                        title.className = 'title';
                        title.innerHTML = `${escapeHtml(track.name)}<div class="muted small">id: ${escapeHtml(track.id)}</div>`;
                        trackElement.appendChild(title);


                        let actions = document.createElement('div');
                        actions.className = 'track-actions';

                        let volume_input = document.createElement('input');
                        volume_input.type = 'range';
                        volume_input.min = 0;
                        volume_input.max = 100;
                        volume_input.value = Math.round((track.volume || 0.5) * 100);
                        volume_input.oninput = (e) => this.setTrackVolume(track.id, e.target.value);
                        trackElement.appendChild(volume_input);

                        let play_button = document.createElement('button');
                        play_button.className = 'button';
                        play_button.innerHTML = '▶';
                        play_button.onclick = () => this.playTrackInBrowser(this, track);
                        trackElement.appendChild(play_button);

                        let delete_button = document.createElement('button');
                        delete_button.className = 'button';
                        delete_button.innerHTML = '🗑';
                        delete_button.onclick = () => this.deleteTrack(this.id, track.id);
                        trackElement.appendChild(delete_button);

                        trackElement.appendChild(actions);


                        trackList.appendChild(trackElement);
                    });
                }

                async uploadTrack(file) {
                    try {
                        let fd = new FormData();
                        fd.append('file', file);
                        let res = await fetch('/audio_player/playlist/' + encodeURIComponent(this.id) + '/track', { method: 'POST', body: fd });
                        if (!res.ok) {
                            let t = await res.text();
                            throw new Error(res.status + ' ' + t);
                        }
                        await playlists.selectPlaylist(this.id);
                        hideModal();
                    }
                    catch(err) {
                        alert('Ошибка загрузки трека: ' + err.message);
                    }
                }

                async setTrackVolume(trackId, volume) {
                    try {
                        let vol = Number(volume) / 100;
                        await api('/audio_player/playlist/' + encodeURIComponent(this.id) + '/track/' + encodeURIComponent(trackId) + '/volume/' + encodeURIComponent(vol), {method:'POST'});
                    }
                    catch(err) {
                        console.warn(err);
                    }
                }

                async deleteTrack(playlistId, trackId) {
                    if (!confirm('Удалить трек?')) return;
                    try {
                        await api('/audio_player/playlist/' + encodeURIComponent(playlistId) + '/track/' + encodeURIComponent(trackId), {method:'DELETE'});
                        await playlists.selectPlaylist(playlistId);
                    }
                    catch(err) {
                        alert('Ошибка удаления трека: ' + err.message);
                    }
                }

                async playTrackInBrowser(playlist, track) {
                    let player = $('player');
                    let url = '/audio_player/records/' + encodeURIComponent(playlist.directory) + '/' + encodeURIComponent(track.name);

                    try {
                        let head = await fetch(url, {method: 'HEAD'});
                        if (!head.ok) {
                            let txt = await head.text().catch(() => head.statusText || 'Not found');
                            alert('Файл недоступен: ' + head.status + ' ' + txt);
                            return;
                        }
                    }
                    catch(err) {
                        console.warn('HEAD request failed, will try to load directly:', err);
                    }

                    player.onerror = function(e) {
                        let code = player.error && player.error.code ? player.error.code : 'unknown';
                        fetch(url).then(async r => {
                            if (!r.ok) {
                                let txt = await r.text().catch(()=>r.statusText);
                                console.warn('Ошибка при загрузке трека: ' + r.status + ' ' + txt);
                            }
                        }).catch(() => {
                            console.warn('Ошибка при загрузке трека. Проверьте доступность файла на сервере. (audio error code: ' + code + ')');
                        });
                    };

                    player.src = url;
                    player.play().catch(err => console.warn('Не удалось начать воспроизведение в браузере:', err));
                }

                confirmAddTrack() {
                    let fileInput = $('trackFile');
                    if (!fileInput.files.length) {
                        alert('Выберите файл');
                        return;
                    }
                    let file = fileInput.files[0];
                    this.uploadTrack(file);
                }
            }
        </script>
    </head>
    <body>
        <div class="app">
            <header class="top">
                <div class="current-track">
                    <h3 id="currentTitle">Текущий трек — —</h3>
                </div>
                <div class="controls">
                    <button class="button big-button" id="btnPlay">▶</button>
                    <button class="button big-button" id="btnPause">❚❚</button>
                    <button class="button" id="btnNext">⏭</button>
                    <div style="width:8px"></div>
                    <label class="small muted">Громкость</label>
                    <input type="range" id="globalVolume" min="0" max="100"/>
                </div>
            </header>

            <aside class="left">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
                    <h4 style="margin:0">Плейлисты</h4>
                    <div class="actions">
                        <button class="button" id="btnRefresh">⟳</button>
                        <button class="button" id="btnAddPlaylist">＋</button>
                    </div>
                </div>
                <div id="playlists" class="playlist-list"></div>
            </aside>

            <section class="right">
                <div style="display:flex;align-items:center;justify-content:space-between">
                    <div>
                        <h4 id="playlistName">—</h4>
                        <div class="muted small" id="playlistInfo">Выберите плейлист</div>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px">
                        <label class="small muted">Громкость</label>
                        <input type="range" id="playlistVolume" min="0" max="100" style="width:120px" />
                    </div>

                    <div>
                        <button class="button big-button" id="btnDelete">Удалить</button>
                    </div>
                </div>

                <div style="display:flex;gap:8px;margin-top:12px;align-items:center">
                    <button class="button" id="btnAddTrack">＋</button>
                </div>

                <div id="TrackList" class="TrackList"></div>
            </section>
        </div>

        <div id="modal" class="modal-backdrop">
            <div class="modal" id="modalContent"></div>
        </div>

        <audio id="player" controls class="non-display"></audio>

        <script>
            let serverAudioPlayer = new ServerAudioPlayer();
            serverAudioPlayer.bindUI();

            let playlists = new Playlists();
            playlists.bindUI();
        </script>
    </body>
</html>
