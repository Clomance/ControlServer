<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Music Control Console</title>
<style>
  :root{
    --bg:#f8fafb;--panel:#ffffff;--muted:#6b7280;--accent:#2563eb;
    --accent-weak:rgba(37,99,235,0.08);--border:#e6eef6;
    --shadow:0 6px 18px rgba(14,30,45,0.06);--radius:12px;
    font-family:Inter,Roboto,system-ui,-apple-system,"Segoe UI";
  }
  html,body{margin:0;height:100%;background:var(--bg);color:#0f172a;}
  .app{max-width:1200px;margin:20px auto;padding:18px;}
  .panel{background:var(--panel);border:1px solid var(--border);
         border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;}
  .top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
  .current-info{flex:1 1 320px;}
  .controls{display:flex;gap:8px;align-items:center;}
  .btn{background:transparent;border:1px solid var(--border);
       border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;}
  .btn.primary{background:var(--accent);color:#fff;border:none;}
  input[type=range]{width:160px;-webkit-appearance:none;height:6px;
       background:var(--border);border-radius:6px;}
  input[type=range]::-webkit-slider-thumb{
       -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
       background:var(--accent);}
  .main{display:flex;gap:16px;margin-top:16px;}
  .left{width:260px;flex:0 0 260px;display:flex;flex-direction:column;gap:12px;}
  .right{flex:1;display:flex;flex-direction:column;gap:12px;}
  .playlists-list,.tracks-list{display:flex;flex-direction:column;gap:8px;
       overflow:auto;max-height:60vh;}
  .playlist-item,.track{padding:10px;border-radius:10px;border:1px solid transparent;
       display:flex;align-items:center;justify-content:space-between;}
  .playlist-item:hover,.track:hover{background:var(--accent-weak);}
  .playlist-item.active{border-color:var(--accent);}
  .file-uploader{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  @media(max-width:900px){.main{flex-direction:column;}.left{width:100%;}}
</style>
</head>
<body>
<div class="app">
  <div class="top panel">
    <div class="current-info">
      <div class="heading" id="current-title">— Нет текущего трека —</div>
    </div>
    <div class="controls">
      <!-- UPDATED -->
      <button class="btn primary" id="btn-play">Play</button>
      <button class="btn" id="btn-pause">Pause</button>
      <button class="btn" id="btn-next">≫</button>
    </div>
    <div style="flex:1"></div>
    <div style="text-align:right;">
      <div class="muted">Глобальная громкость</div>
      <div class="flex">
        <input id="global-volume" type="range" min="0" max="1" step="0.01" value="1"/>
        <div class="chip" id="global-volume-label">100%</div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="left panel">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div class="heading">Плейлисты</div>
        </div>
        <button class="btn" id="btn-refresh">Обновить</button>
      </div>
      <div style="display:flex;gap:8px;">
        <input id="new-playlist-name" placeholder="Новый плейлист" style="flex:1;padding:8px;border:1px solid var(--border);border-radius:8px;">
        <button class="btn primary" id="open-create-modal">Создать плейлист</button>
      </div>
      <div class="playlists-list" id="playlists-list"></div>
    </div>

    <div class="right panel">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div class="heading" id="playlist-title">Плейлист — (ничего не выбрано)</div>
          <div class="sub" id="playlist-sub"></div>
        </div>
        <div>
          <div class="muted">Громкость плейлиста</div>
          <input id="playlist-volume" type="range" min="0" max="1" step="0.01" value="1">
          <div id="playlist-volume-label" style="font-size:13px;color:var(--muted)">100%</div>
        </div>
        <button class="btn danger" id="btn-delete-playlist">Удалить</button>
      </div>
      <div class="file-uploader">
        <input id="track-name" placeholder="Имя трека" style="padding:8px;border-radius:8px;border:1px solid var(--border)">
        <input id="track-file" type="file" accept="audio/*">
        <button class="btn primary" id="btn-add-track">Загрузить</button>
      </div>
      <div class="tracks-list" id="tracks-list"></div>
    </div>
  </div>
</div>

<script>
const API_BASE = '/audio_player';
let state={playlists:[],selectedPlaylist:null,globalVolume:1,playlistVolumes:{},trackVolumes:{}};

const el = id => document.getElementById(id);

async function apiFetch(path,opts={}) {
  const r=await fetch(API_BASE+path,opts);
  if(!r.ok) throw new Error(await r.text());
  try{return await r.json();}catch{return null;}
}

/* === Current track === */
async function loadCurrent() {
  try {
    const data = await apiFetch('/current');
    state.current = data.track || null;
    el('current-title').textContent = state.current;
  } catch(e) {
    console.warn('loadCurrent failed', e);
    el('current-title').textContent = 'Ошибка загрузки текущего трека';
  }
}
/* === Global volume === */
async function loadGlobalVolume(){
  try{
    const d=await apiFetch('/volume');
    const v=Number(d?.volume??1);
    state.globalVolume=v;
    const s=document.getElementById('global-volume');
    s.value=v;
    document.getElementById('global-volume-label').textContent=Math.round(v*100)+'%';
  }catch{}
}
async function setGlobalVolume(v){
  try{await apiFetch(`/volume/${v}`,{method:'POST'});
    state.globalVolume=v;
    document.getElementById('global-volume-label').textContent=Math.round(v*100)+'%';
    updateAllAudioVolumes();
  }catch{}
}

/* === Playlists === */
async function loadPlaylists(){
  const d=await apiFetch('/playlists');
  state.playlists=d.playlists||[];
  renderPlaylists();
}
function renderPlaylists(){
  const c=document.getElementById('playlists-list');
  c.innerHTML='';
  if(!state.playlists.length){c.textContent='Нет плейлистов';return;}
  for(const p of state.playlists){
    const el=document.createElement('div');
    el.className='playlist-item'+(state.selectedPlaylist?.id===p.id?' active':'');
    el.innerHTML=`<div>${p.name||p.id}</div><button class="btn">Открыть</button>`;
    el.querySelector('button').onclick=()=>selectPlaylist(p.id);
    c.appendChild(el);
  }
}
async function createPlaylist(){
  const n=document.getElementById('new-playlist-name').value.trim();
  if(!n) return alert('Введите имя');
  await apiFetch('/playlist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});
  document.getElementById('new-playlist-name').value='';
  loadPlaylists();
}
async function deletePlaylist(){
  if(!state.selectedPlaylist) return;
  if(!confirm('Удалить плейлист?'))return;
  await apiFetch(`/playlist/${state.selectedPlaylist.id}`,{method:'DELETE'});
  state.selectedPlaylist=null;
  loadPlaylists();
  document.getElementById('tracks-list').innerHTML='';
  document.getElementById('playlist-title').textContent='Плейлист — (ничего не выбрано)';
}
async function selectPlaylist(id){
  const d=await apiFetch(`/playlist/${id}`);
  const p=d.playlist;p.id=id;
  state.selectedPlaylist=p;
  document.getElementById('playlist-title').textContent=p.name||id;
  document.getElementById('playlist-sub').textContent=`Треков: ${p.tracks?.length||0}`;
  state.playlistVolumes[id]=p.volume??1;
  document.getElementById('playlist-volume').value=p.volume??1;
  document.getElementById('playlist-volume-label').textContent=Math.round((p.volume??1)*100)+'%';
  renderTracks(p);
}
function renderTracks(p){
  const l=document.getElementById('tracks-list');
  l.innerHTML='';
  for(const t of p.tracks||[]){
    const tid=t.id||t.name;
    state.trackVolumes[p.id]??={};
    state.trackVolumes[p.id][tid]=t.volume??1;
    const div=document.createElement('div');
    div.className='track';
    div.innerHTML=`
      <div>${t.name||tid}</div>
      <div style="display:flex;align-items:center;gap:6px;">
        <audio id="audio-${tid}" controls preload="none"
         src="${API_BASE}/playlist/${encodeURIComponent(p.id)}/track/${encodeURIComponent(tid)}"></audio>
        <input type="range" min="0" max="1" step="0.01" value="${t.volume??1}"
         data-pid="${p.id}" data-tid="${tid}" class="track-volume">
        <button class="btn">Удалить</button>
      </div>`;
    div.querySelector('button').onclick=async()=>{
      if(confirm('Удалить трек?')){
        await apiFetch(`/playlist/${p.id}/track/${tid}`,{method:'DELETE'});
        selectPlaylist(p.id);
      }
    };
    l.appendChild(div);
  }
  l.querySelectorAll('.track-volume').forEach(inp=>{
    inp.oninput=e=>{
      const v=e.target.value,pid=e.target.dataset.pid,tid=e.target.dataset.tid;
      state.trackVolumes[pid][tid]=v;updateAudioVolume(pid,tid);
    };
    inp.onchange=e=>{
      const v=e.target.value,pid=e.target.dataset.pid,tid=e.target.dataset.tid;
      apiFetch(`/playlist/${pid}/track/${tid}/volume/${v}`,{method:'POST'});
    };
  });
}
async function uploadTrack(){
  const p=state.selectedPlaylist;if(!p)return alert('Выберите плейлист');
  const name=document.getElementById('track-name').value.trim();
  const file=document.getElementById('track-file').files[0];if(!file)return alert('Выберите файл');
  const fd=new FormData();fd.append('name',name||file.name);fd.append('file',file);
  await fetch(`${API_BASE}/playlist/${p.id}/track`,{method:'POST',body:fd});
  document.getElementById('track-name').value='';document.getElementById('track-file').value='';
  selectPlaylist(p.id);
}

/* === Volumes === */
function updateAudioVolume(pid,tid){
  const a=document.getElementById('audio-'+tid);if(!a)return;
  a.volume=state.globalVolume*(state.playlistVolumes[pid]??1)*(state.trackVolumes[pid]?.[tid]??1);
}
function updateAllAudioVolumes(){
  document.querySelectorAll('audio[id^="audio-"]').forEach(a=>{
    const tid=a.id.replace('audio-','');
    const inp=document.querySelector(`.track-volume[data-tid="${CSS.escape(tid)}"]`);
    if(inp) updateAudioVolume(inp.dataset.pid,tid);
  });
}

/* === Buttons === */
document.getElementById('btn-play').onclick=()=>apiFetch('/current/action/play',{method:'POST'});
document.getElementById('btn-pause').onclick=()=>apiFetch('/current/action/pause',{method:'POST'});
document.getElementById('btn-next').onclick=()=>apiFetch('/current/action/playnext',{method:'POST'});
document.getElementById('btn-refresh').onclick=loadPlaylists;
// document.getElementById('btn-add-playlist').onclick=createPlaylist;
document.getElementById('btn-delete-playlist').onclick=deletePlaylist;
document.getElementById('btn-add-track').onclick=uploadTrack;
document.getElementById('global-volume').oninput=e=>{
  document.getElementById('global-volume-label').textContent=Math.round(e.target.value*100)+'%';
  state.globalVolume=e.target.value;updateAllAudioVolumes();
};
document.getElementById('global-volume').onchange=e=>setGlobalVolume(e.target.value);
document.getElementById('playlist-volume').onchange=e=>{
  const v=e.target.value;if(!state.selectedPlaylist)return;
  apiFetch(`/playlist/${state.selectedPlaylist.id}/volume/${v}`,{method:'POST'});
  state.playlistVolumes[state.selectedPlaylist.id]=v;updateAllAudioVolumes();
  document.getElementById('playlist-volume-label').textContent=Math.round(v*100)+'%';
};

/* === Periodic update === */
async function periodic(){
  await loadCurrent();
  await loadGlobalVolume();
}
setInterval(periodic,5000);

/* === Init === */
periodic();loadPlaylists();
</script>



<div id="create-modal" class="modal">
  <div class="modal-content panel">
    <h3>Новый плейлист</h3>
    <form id="create-playlist-form" onsubmit="return createPlaylistForm(event)">
      <input id="playlist-name-input" type="text" required placeholder="Название плейлиста" />
      <textarea id="playlist-desc-input" rows="2" placeholder="Описание (необязательно)"></textarea>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button type="button" class="btn" id="cancel-create">Отмена</button>
        <button type="submit" class="btn primary">Создать</button>
      </div>
    </form>
  </div>
</div>

<style>
.modal{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.3);display:none;align-items:center;justify-content:center;
}
.modal.active{display:flex;}
.modal-content{max-width:400px;width:90%;animation:fadeIn 0.2s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:none;}}
.modal-content input,.modal-content textarea{
  width:100%;margin-top:8px;padding:8px;border:1px solid var(--border);
  border-radius:8px;font-size:15px;resize:none;
}
</style>

<script>
const modal=document.getElementById('create-modal');
document.getElementById('open-create-modal').onclick=()=>modal.classList.add('active');
document.getElementById('cancel-create').onclick=()=>modal.classList.remove('active');

async function createPlaylistForm(e){
  e.preventDefault();
  const name=document.getElementById('playlist-name-input').value.trim();
  const desc=document.getElementById('playlist-desc-input').value.trim();
  if(!name)return alert('Введите название');
  await fetch('/audio_player/playlist',{
    method:'POST',
    headers:{'Content-Type':'multipart/form-data'},
    body:JSON.stringify({name,description:desc})
  });
  modal.classList.remove('active');
  if(typeof loadPlaylists==='function') loadPlaylists();
}
</script>
</body>
</html>
