[package]
name = "audio_server"
version = "0.1.0"
authors = ["Clomance"]
edition = "2024"


[dependencies]
rand = "0.9.2"
chrono = "0.4.42"
serde_json = "1.0.145"
num-rational = "0.4.2"


[dependencies.symphonia]
version = "0.5.4"
features = ['pcm', 'mp3', 'wav', 'isomp4', 'aac', 'alac']


[dependencies.tower-http]
version = "0.6.6"
features = ["cors", "fs"]


[dependencies.serde]
version  = "1.0.228"
features = ["derive"]


[dependencies.tokio]
version = "1.47.1"
features = ["full"]


[dependencies.axum]
version = "0.8.6"
features = ["multipart"]


[dependencies.cat_audio]
path = "../CatEngineProject/cat_audio"
version  = "0.1.0"